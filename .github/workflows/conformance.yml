name: Conformance (E2E)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "examples/**"
      - "spec/**"
      - "apps/docs/**"
      - ".github/workflows/conformance.yml"

env:
  TURBO_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  astro-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter='@dualmark/*'
      - name: Build astro-blog example
        run: bun run --filter dualmark-example-astro-blog build
      - name: Verify astro-blog under astro dev
        working-directory: examples/astro-blog
        run: |
          ./node_modules/.bin/astro dev --port 4321 &
          DEV_PID=$!
          sleep 10
          node ../../packages/cli/dist/cli.js verify http://localhost:4321/blog/hello-world --skip-negotiation
          kill $DEV_PID

  sanity-astro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter='@dualmark/*'
      - name: Test sanity-astro example
        run: bun run --filter dualmark-example-sanity-astro test
      - name: Build sanity-astro example from fixtures
        run: bun run --filter dualmark-example-sanity-astro build
      - name: Verify sanity-astro under astro dev
        working-directory: examples/sanity-astro
        run: |
          ./node_modules/.bin/astro dev --host 127.0.0.1 --port 4322 &
          DEV_PID=$!
          trap 'kill $DEV_PID || true' EXIT
          sleep 10
          node ../../packages/cli/dist/cli.js verify http://127.0.0.1:4322/blog/cms-driven-aeo --skip-negotiation
          node ../../packages/cli/dist/cli.js verify http://127.0.0.1:4322/glossary/answer-engine-optimization --skip-negotiation

  astro-cloudflare-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter='@dualmark/*'
      - name: Build astro-cloudflare-full
        run: bun run --filter dualmark-example-astro-cloudflare-full build
      - name: Verify under wrangler dev (full negotiation)
        working-directory: examples/astro-cloudflare-full
        run: |
          ./node_modules/.bin/wrangler dev --port 8787 --local --no-bundle=false &
          WRANGLER_PID=$!
          sleep 15
          node ../../packages/cli/dist/cli.js verify http://localhost:8787/blog/edge-aeo
          kill $WRANGLER_PID

  nextjs-app-router:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter='@dualmark/*'
      - name: Run nextjs-app-router under next dev
        working-directory: examples/nextjs-app-router
        run: |
          ./node_modules/.bin/next dev --port 3000 &
          NEXT_PID=$!
          sleep 15
          node ../../packages/cli/dist/cli.js verify http://localhost:3000/posts/hello
          kill $NEXT_PID

  vercel-edge-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter='@dualmark/*'
      - name: Run vercel-edge-full under next dev
        working-directory: examples/vercel-edge-full
        run: |
          ./node_modules/.bin/next dev --port 3001 &
          NEXT_PID=$!
          sleep 15
          node ../../packages/cli/dist/cli.js verify http://localhost:3001/posts/hello
          kill $NEXT_PID

  sveltekit-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter='@dualmark/*'
      - name: Build sveltekit-blog example
        run: bun run --filter dualmark-example-sveltekit-blog build
      - name: Verify sveltekit-blog under vite dev
        working-directory: examples/sveltekit-blog
        run: |
          ./node_modules/.bin/vite dev --host 127.0.0.1 --port 5173 &
          VITE_PID=$!
          sleep 10
          node ../../packages/cli/dist/cli.js verify http://localhost:5173/posts/hello
          kill $VITE_PID

  deno-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter='@dualmark/*'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Deno example tests
        working-directory: examples/deno-deploy
        run: deno task test

  dualmark-docs-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter='@dualmark/*'
      - name: Build dualmark-docs (the website itself)
        run: bun run --filter dualmark-docs build
      - name: Start dualmark-docs and verify against the AEO Spec
        working-directory: apps/docs
        run: |
          ./node_modules/.bin/next start --port 4000 &
          DOCS_PID=$!
          sleep 8
          THRESHOLD=105
          fail=0
          for path in / /docs /docs/quickstart /docs/spec/headers /play; do
            echo "::group::verify ${path}"
            score=$(node ../../packages/cli/dist/cli.js verify "http://localhost:4000${path}" --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d);console.log(r.score)})')
            echo "score=${score}"
            if [ "${score}" -lt "${THRESHOLD}" ]; then
              echo "::error::${path} scored ${score}/125 (below threshold ${THRESHOLD})"
              fail=1
            fi
            echo "::endgroup::"
          done
          kill $DOCS_PID
          exit $fail

  action-dogfood:
    # Dogfood the published action against this repo's freshly-built docs (not live
    # dualmark.dev), so regressions are caught before they ship. See #17.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout only
      actions: read # the action lists prior aeo-report artifacts via the API
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter='@dualmark/*'
      - name: Build dualmark-docs (the website itself)
        run: bun run --filter dualmark-docs build
      - name: Start dualmark-docs server
        working-directory: apps/docs
        run: |
          ./node_modules/.bin/next start --port 4000 &
          echo $! > "${{ runner.temp }}/docs.pid"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ >/dev/null 2>&1; then
              echo "Docs server is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Docs server did not start within 30s"
          exit 1
      - name: Smoke test verify action against the freshly-built docs
        uses: dodopayments/dualmark-verify-action@8095f353a65f95ebf9470338e5c4d1894049850f # v1.0.0
        with:
          url: http://localhost:4000/docs/quickstart
          level: standard
          comment-on-pr: false
          fail-on-regression: false
      - name: Stop dualmark-docs server
        if: always()
        run: kill "$(cat "${{ runner.temp }}/docs.pid")" 2>/dev/null || true

  fastly-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Setup Fastly CLI
        uses: fastly/compute-actions/setup@v3
      - run: bunx turbo run build --filter='@dualmark/*'
      - name: Build fastly-compute example
        run: bun run --filter fastly-compute-example build
      - name: Verify fastly-compute under fastly compute serve
        working-directory: examples/fastly-compute
        run: |
          python3 -m http.server 4000 --directory origin-content &
          ORIGIN_PID=$!
          fastly compute serve --port 8080 &
          FASTLY_PID=$!
          sleep 10
          node ../../packages/cli/dist/cli.js verify http://127.0.0.1:8080/
          kill $FASTLY_PID
          kill $ORIGIN_PID
