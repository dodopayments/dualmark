name: Dualmark Verify
description: Verify AEO conformance of any URL against the AEO Specification v1.0
author: Dodo Payments

inputs:
  url:
    description: URL to verify for AEO conformance
    required: true
  level:
    description: Minimum conformance level (basic, standard, advanced)
    required: false
    default: standard
  fail-on-regression:
    description: Fail if score drops below the previous run's result
    required: false
    default: "false"
  comment-on-pr:
    description: Post a sticky PR comment with the score table
    required: false
    default: "false"
  artifact-name:
    description: Name of the uploaded artifact (useful for multi-URL workflows)
    required: false
    default: "aeo-report"

outputs:
  score:
    description: Numeric score achieved
    value: ${{ steps.parse.outputs.score }}
  max:
    description: Maximum possible score
    value: ${{ steps.parse.outputs.max }}
  level:
    description: Conformance level detected (none/basic/standard/advanced)
    value: ${{ steps.parse.outputs.level }}

runs:
  using: composite

  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1

    - name: Find previous report artifact
      id: find-previous
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      run: |
        echo "::group::🔍 Locating previous AEO report"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        BRANCH="$BRANCH_NAME"
        echo "  Branch:      $BRANCH"
        echo "  Artifact:    $ARTIFACT_NAME"

        RUN_ID=$(gh api \
          "/repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=50" \
          --jq '.artifacts | map(select(.workflow_run.head_branch == "'"$BRANCH"'")) | .[0].workflow_run.id // empty')

        if [ -n "$RUN_ID" ]; then
          echo "  Status:      ✅ Found previous run"
          echo "  Run ID:      #$RUN_ID"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
        else
          echo "  Status:      ⚠️  No previous report found"
          echo "  Note:        This is the first verification on this branch"
        fi
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "::endgroup::"

    - name: Download previous report
      if: steps.find-previous.outputs.run-id != ''
      id: download
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/previous
        github-token: ${{ github.token }}
        run-id: ${{ steps.find-previous.outputs.run-id }}

    - name: Extract baseline score
      id: baseline
      shell: bash
      run: |
        echo "::group::📊 Baseline comparison"

        PREV_FILE="${{ runner.temp }}/previous/aeo.json"
        if [ -f "$PREV_FILE" ]; then
          BASELINE=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('$PREV_FILE','utf8')).score)")
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "::notice::Previous baseline established: $BASELINE"
        else
          echo "baseline=-1" >> "$GITHUB_OUTPUT"
          echo "::notice::No baseline file found — regression check will be skipped"
        fi
        echo "::endgroup::"

    - name: Run dualmark verify
      shell: bash
      id: verify
      env:
        TARGET_URL: ${{ inputs.url }}
      run: |
        echo "::group::🔬 Running AEO verification"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  Target URL:  $TARGET_URL"
        echo "  Executing:   bunx @dualmark/cli verify --json"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        bunx @dualmark/cli verify "$TARGET_URL" --json > "${{ runner.temp }}/aeo.json" || true # failure handled by parse step
        echo "::endgroup::"

    - name: Parse report
      id: parse
      shell: bash
      run: |
        echo "::group::📋 Verification results"

        FILE="${{ runner.temp }}/aeo.json"
        if [ ! -f "$FILE" ]; then
          echo "score=0" >> "$GITHUB_OUTPUT"
          echo "max=0" >> "$GITHUB_OUTPUT"
          echo "level=none" >> "$GITHUB_OUTPUT"
          echo "::error title=CLI Failure::aeo.json was not created — the CLI exited without producing a report. Check that the URL is reachable."
          exit 1
        fi

        bun -e "
          const fs = require('fs');
          const out = process.env.GITHUB_OUTPUT;
          try {
            const r = JSON.parse(fs.readFileSync('$FILE', 'utf8'));
            if (typeof r.score !== 'number' || typeof r.max !== 'number') throw new Error('missing numeric fields');
            fs.appendFileSync(out, 'score=' + (r.score ?? 0) + '\n');
            fs.appendFileSync(out, 'max=' + (r.max ?? 0) + '\n');
            fs.appendFileSync(out, 'level=' + (r.level ?? 'none') + '\n');
            console.log((r.score ?? 0) + ' ' + (r.max ?? 0) + ' ' + (r.level ?? 'none'));
          } catch (e) {
            fs.appendFileSync(out, 'score=0\nmax=0\nlevel=none\n');
            console.log('PARSE_ERROR');
          }
        " > /tmp/aeo_parse_result

        read -r SCORE MAX LEVEL < <(cat /tmp/aeo_parse_result)
        if [ "$SCORE" = "PARSE_ERROR" ]; then
          echo "::error title=CLI Failure::CLI produced malformed JSON — check the verify logs above"
          exit 1
        fi

        echo "  Score: $SCORE/$MAX"
        echo "  Level: $LEVEL"
        echo "::endgroup::"

    - name: Check regression against previous run
      if: inputs.fail-on-regression == 'true'
      id: check-regression
      continue-on-error: true
      shell: bash
      env:
        SCORE: ${{ steps.parse.outputs.score }}
        BASELINE: ${{ steps.baseline.outputs.baseline }}
      run: |
        echo "::group::📈 Regression check"

        if [ "$BASELINE" -eq -1 ]; then
          echo "::notice::No baseline available — first run on this branch"
        elif [ "$SCORE" -lt "$BASELINE" ]; then
          DIFF=$(( BASELINE - SCORE ))
          echo "::error title=Regression Detected::Score dropped from $BASELINE to $SCORE (-$DIFF points)"
          exit 1
        else
          echo "::notice::No regression — score $SCORE is >= baseline $BASELINE"
        fi
        echo "::endgroup::"

    - name: Check conformance level
      id: check-level
      continue-on-error: true
      shell: bash
      env:
        REQUIRED: ${{ inputs.level }}
        ACTUAL: ${{ steps.parse.outputs.level }}
      run: |
        echo "::group::🎯 Conformance level check"

        LEVELS="none basic standard advanced"
        REQ_IDX=$(echo "$LEVELS" | tr ' ' '\n' | grep -nx "$REQUIRED" | cut -d: -f1)
        ACT_IDX=$(echo "$LEVELS" | tr ' ' '\n' | grep -nx "$ACTUAL" | cut -d: -f1)

        if [ -z "$REQ_IDX" ]; then
          echo "::error title=Invalid Input::Level '$REQUIRED' is invalid. Must be: basic, standard, advanced"
          exit 1
        fi
        if [ "$ACT_IDX" -lt "$REQ_IDX" ]; then
          echo "::error title=Level Check Failed::Achieved '$ACTUAL', but required '$REQUIRED'"
          exit 1
        fi
        echo "::notice::Level check passed: $ACTUAL meets $REQUIRED requirement"
        echo "::endgroup::"

    - name: Upload report artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/aeo.json
        if-no-files-found: error
        overwrite: true

    - name: Write professional summary & terminal UI
      shell: bash
      env:
        SCORE: ${{ steps.parse.outputs.score }}
        MAX: ${{ steps.parse.outputs.max }}
        LEVEL: ${{ steps.parse.outputs.level }}
        REQUIRED: ${{ inputs.level }}
        BASELINE: ${{ steps.baseline.outputs.baseline }}
        LEVEL_OUTCOME: ${{ steps.check-level.outcome }}
        REGRESSION_OUTCOME: ${{ steps.check-regression.outcome }}
        REGRESSION_ENABLED: ${{ inputs.fail-on-regression }}
        URL: ${{ inputs.url }}
      run: |
        if [ "$MAX" -gt 0 ]; then
          PCT=$(( SCORE * 100 / MAX ))
        else
          PCT=0
        fi

        OVERALL_STATUS="✅ PASSED"
        if [ "$LEVEL_OUTCOME" != "success" ]; then
          OVERALL_STATUS="❌ FAILED"
        fi
        if [ "$REGRESSION_ENABLED" = "true" ] && [ "$REGRESSION_OUTCOME" != "success" ]; then
          OVERALL_STATUS="❌ FAILED"
        fi

        BASELINE_DISP="—"
        if [ "$REGRESSION_ENABLED" = "true" ] && [ "$BASELINE" -ge 0 ]; then
          BASELINE_DISP="$BASELINE"
        fi

        echo "::group::🛡️ AEO Verification Result"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  🎯 Target:    ${URL}"
        echo "  📊 Score:     ${SCORE} / ${MAX} (${PCT}%)"
        echo "  🏆 Level:     ${LEVEL} (required: ${REQUIRED})"
        if [ "$REGRESSION_ENABLED" = "true" ] && [ "$BASELINE" -ge 0 ]; then
          echo "  📈 Baseline:  ${BASELINE_DISP}"
        fi
        echo "  ✨ Status:    ${OVERALL_STATUS}"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "::endgroup::"

        echo "::notice title=🛡️ Dualmark AEO::Score: ${SCORE}/${MAX} (${PCT}%) | Level: ${LEVEL} | Status: ${OVERALL_STATUS#* }"

        if [ "$REGRESSION_ENABLED" != "true" ]; then
          REG_STATUS="⏭️ Skipped"
          REG_DETAIL="Regression tracking disabled"
        elif [ "$REGRESSION_OUTCOME" == "success" ]; then
          REG_STATUS="✅ Passed"
          REG_DETAIL="Score \`${SCORE}\` ≥ baseline \`${BASELINE_DISP}\`"
        else
          REG_STATUS="❌ Failed"
          REG_DETAIL="Score \`${SCORE}\` < baseline \`${BASELINE_DISP}\` (dropped $(( BASELINE - SCORE )) pts)"
        fi

        if [ "$LEVEL_OUTCOME" == "success" ]; then
          LVL_STATUS="✅ Passed"
          LVL_DETAIL="Achieved \`${LEVEL}\` (required \`${REQUIRED}\`)"
        else
          LVL_STATUS="❌ Failed"
          LVL_DETAIL="Achieved \`${LEVEL}\`, but required \`${REQUIRED}\`"
        fi

        cat >> "$GITHUB_STEP_SUMMARY" <<-EOF
        ## 🛡️ Dualmark AEO Conformance Report

        > **Overall Status:** **${OVERALL_STATUS}**

        ### 📊 Verification Results
        | Metric | Value |
        | :--- | :--- |
        | **Target URL** | [\`${URL}\`](${URL}) |
        | **Score** | \`${SCORE} / ${MAX}\` (${PCT}%) |
        | **Baseline** | \`${BASELINE_DISP}\` |

        ### ✅ Checks
        | Check | Status | Details |
        | :--- | :---: | :--- |
        | **Conformance Level** | ${LVL_STATUS} | ${LVL_DETAIL} |
        | **Regression** | ${REG_STATUS} | ${REG_DETAIL} |

        ---
        <sub>Powered by <a href="https://dualmark.dev">Dualmark</a> • <a href="https://dualmark.dev/docs/spec/overview">AEO Specification v1.0</a> · Commit \`${GITHUB_SHA:0:7}\`</sub>
        EOF

    - name: Post PR comment
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0
      with:
        header: dualmark-verify
        skip_unchanged: true
        message: |
          ## 🛡️ Dualmark AEO Conformance Report

          | Metric | Value |
          | :--- | :--- |
          | **Score** | `${{ steps.parse.outputs.score }} / ${{ steps.parse.outputs.max }}` |
          | **Baseline** | ${{ steps.baseline.outputs.baseline != '-1' && format('`{0}`', steps.baseline.outputs.baseline) || '—' }} |
          | **Level** | `${{ steps.parse.outputs.level }}` (required `${{ inputs.level }}`) |
          | **Level check** | ${{ steps.check-level.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |
          | **Regression** | ${{ inputs.fail-on-regression != 'true' && '⏭️ Skipped' || (steps.check-regression.outcome == 'success' && '✅ PASS' || '❌ FAIL') }} |

          <sub>Powered by <a href="https://dualmark.dev">Dualmark</a> • <a href="https://dualmark.dev/docs/spec/overview">AEO Specification v1.0</a> · Commit \`${{ github.sha }}\`</sub>

    - name: Fail if checks failed
      # Only flag regression failure when fail-on-regression is true (otherwise skipped)
      if: steps.check-level.outcome == 'failure' || (inputs.fail-on-regression == 'true' && steps.check-regression.outcome == 'failure')
      shell: bash
      env:
        SCORE: ${{ steps.parse.outputs.score }}
        MAX: ${{ steps.parse.outputs.max }}
        REQUIRED: ${{ inputs.level }}
      run: |
        echo "::error title=Pipeline Failed::AEO conformance checks did not pass. Review the Job Summary for details."
        exit 1

branding:
  icon: check-circle
  color: green
